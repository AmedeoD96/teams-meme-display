; Teams status meme display -- ESP32-2432S028R ("Cheap Yellow Display").
;
;   pio run -t upload      flash the firmware
;   pio run -t uploadfs    flash the meme pack built by tools/build_memes.py
;   pio device monitor     watch the log / drive it by hand (see docs/PROTOCOL.md)

[env:cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; The 4MB default table gives ~1.2MB to the app and ~1.5MB to the filesystem, which is where
; the memes live. tools/build_memes.py enforces the same budget.
board_build.partitions = default.csv
board_build.filesystem = littlefs

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bodmer/TJpg_Decoder@^1.1.0
    ; Pulled from git rather than the PlatformIO registry: the registry only carries a 2019
    ; snapshot of this library, which predates the begin(SPIClass&) overload we need to put the
    ; touch controller on its own SPI bus.
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4

build_flags =
    ; ---- TFT_eSPI panel configuration -------------------------------------------------
    ; Configured here rather than by editing the library's User_Setup.h, so a clean checkout
    ; builds correctly. Values are the working CYD setup from vostoklabs/bongo_cat_monitor.
    ;
    ; TFT_WIDTH/TFT_HEIGHT are deliberately NOT set: TFT_eSPI's ILI9341_Defines.h defines them
    ; unconditionally as 240x320 (native portrait), so setting them here only produces a
    ; redefinition warning. Landscape comes from setRotation(1) at runtime.
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_INVERSION_ON=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=27
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    ; Touch is NOT handled by TFT_eSPI: on this board the XPT2046 sits on its own SPI pins
    ; rather than sharing the display bus, so TOUCH_CS here would not work. See touch.cpp.
